<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Napkin: talk through an idea and the board sketches it as you speak." />
    <meta property="og:title" content="Napkin" />
    <meta property="og:description" content="Talk through an idea and the board sketches it as you speak." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9f9fa" />
    <title>Napkin · Talk and it sketches</title>
    <link rel="preload" href="/fonts/Liberation/LiberationSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Excalidraw loads its fonts from here first (public/fonts), then falls back to its CDN. -->
    <script>
      window.EXCALIDRAW_ASSET_PATH = "/";
      // Pick the theme before first paint so a dark system never flashes the light board (see src/ui/useTheme.ts).
      (function () {
        var pref = null;
        try { pref = localStorage.getItem("rtw-theme"); } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
